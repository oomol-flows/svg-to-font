title: "%svg-to-font-converter%"
icon: ":carbon:text-font:"
description: "%convert-svg-icons-to-web-font-files-with-css-woff-and-ttf-format%"

executor:
  name: nodejs
  options:
    entry: main.ts

inputs_def:
  - handle: svg_file
    description: "%single-svg-file-to-convert%"
    json_schema:
      type: string
      ui:widget: file
      ui:options:
        filters:
          - name: SVG Files
            extensions:
              - svg
        excludeAll: true
    nullable: false

  - group: Advanced Options
    collapsed: true

  - handle: out_zip
    description: "%output-directory-or-file-path-for-the-font-package-defaults-to-s%"
    json_schema:
      type: string
      ui:widget: save
      ui:options:
        filters:
          - name: ZIP Archive
            extensions:
              - zip
        excludeAll: false
    value:
    nullable: true

  - handle: fontName
    description: "%font-family-name-defaults-to-iconfont%"
    json_schema:
      type: string
    value:
    nullable: true

  - handle: cssPrefix
    description: "%css-class-prefix-for-icons-defaults-to-icon%"
    json_schema:
      type: string
    value:
    nullable: true

outputs_def:
  - handle: out_zip
    description: "%path-to-the-generated-font-package-zip-file%"
    json_schema:
      type: string
